name: "Orchestra Run Pipeline"
description: "Run a pipeline in Orchestra"
inputs:
  api_key:
    description: "Orchestra API key. Found in the Orchestra UI"
    required: true
  pipeline_id:
    description: "Orchestra pipeline ID"
    required: true
  branch:
    description: "Branch to run the pipeline on"
    required: false
  poll_interval:
    description: "Polling interval in seconds"
    required: false
    default: "10"
  environment:
    description: "Orchestra environment to run the pipeline with"
    required: false
  task_ids:
    description: "Orchestra task IDs to run"
    required: false
  continue_downstream_run:
    description: "Continue running downstream tasks when specifying task_ids to run"
    required: false
  retry_from_failed:
    description: "Retry the pipeline run from the failed tasks rather than re-running every task"
    required: false
  run_inputs:
    description: "A JSON-formatted string containing key-value pairs of pipeline run inputs."
    required: false
  cancel_on_exit:
    description: "Cancel the Orchestra pipeline run if the action stops watching it before it reaches a terminal status, for example when the GitHub job is cancelled"
    required: false
    default: "true"
  wait_for_slot:
    description: "If the run is skipped because the pipeline's concurrency limit is reached, keep trying to start it until a slot frees up"
    required: false
    default: "false"
  wait_for_slot_interval:
    description: "Seconds to wait between start attempts when wait_for_slot is true"
    required: false
    default: "30"
  wait_for_slot_timeout:
    description: "Minutes to keep trying when wait_for_slot is true, before ending as SKIPPED"
    required: false
    default: "60"
outputs:
  status:
    description: "The final status of the pipeline run"
  pipeline_name:
    description: "The name of the pipeline"
  pipeline_run_id:
    description: "The ID of the pipeline run"
runs:
  using: "node24"
  main: "./src/index.js"
  post: "./src/cancel.js"
branding:
  icon: "play"
  color: "purple"
